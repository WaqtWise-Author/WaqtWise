name: Bug report / بلاغ عن مشكلة
description: Something does not work as expected
labels: [bug]
body:
  - type: markdown
    attributes:
      value: Please do not include private data. Screenshots are welcome. / من فضلك لا تضع بيانات خاصة.
  - type: input
    id: version
    attributes:
      label: WaqtWise version
      placeholder: "1.0.0"
    validations:
      required: true
  - type: input
    id: windows
    attributes:
      label: Windows version
      placeholder: Windows 11 23H2
  - type: textarea
    id: steps
    attributes:
      label: Steps to repeat the problem
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What you expected, and what happened instead
    validations:
      required: true
  - type: input
    id: city
    attributes:
      label: Country, city and calculation method (only for prayer-time problems)
