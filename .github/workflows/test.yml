name: Run tests

# Runs on every push and pull request, and by hand (Actions -> Run tests -> Run workflow).
on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: test-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Install
        shell: bash
        # npm ci installs exactly what package-lock.json lists, and stops with a clear error if the file is missing
        run: npm ci
      - name: Run tests
        env:
          REQUIRE_ADHAN: '1' # the prayer-time tests must run here, not be skipped
        run: npm test
